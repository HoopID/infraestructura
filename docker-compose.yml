# Estructura esperada (repos hermanos):
#   HoopID/infraestructura   <- este archivo
#   HoopID/backend-express
#   HoopID/frontend-vue
services:
  db:
    image: postgres:15-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: hoopid_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d hoopid_db"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ../backend-express
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db          # nombre del servicio dentro de la red de compose
      DB_PORT: 5432        # puerto interno de postgres (el 5433 es solo para el host)
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: hoopid_db
      JWT_SECRET: ${JWT_SECRET:?Definí JWT_SECRET en infraestructura/.env (ver .env.example)}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend-vue
      args:
        # Dirección del API vista desde el navegador del usuario.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api}
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
